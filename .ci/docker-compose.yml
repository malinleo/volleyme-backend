name: volleyme-backend

x-app-image: &app-image
  image: cr.selcloud.ru/volleyme-prod/backend:${IMAGE_TAG:-latest}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    <<: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - volleyme-backend

  volleyme-backend:
    <<: [*app-image, *logging]
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./data/jwt:/src/.jwt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  volleyme-migrate:
    <<: *app-image
    profiles: [migrate]
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  volleyme-prepare:
    <<: *app-image
    profiles: [setup]
    env_file:
      - .env
    volumes:
      - ./data/jwt:/src/.jwt
    entrypoint: ["bash", "bash/create_jwt_key_pair.sh"]

  certbot:
    image: certbot/certbot
    profiles: [certbot]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    <<: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -t 5 -U ${DB_USER} || false"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/postgres:/var/lib/postgresql
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
