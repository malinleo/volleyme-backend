upstream backend {
    server volleyme-backend:8000;
}

# --- Rate limiting (uncomment to enable) ---
# 10 requests/sec per IP, shared 10MB zone
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/volleyme.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volleyme.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # --- Request buffering (uncomment to enable) ---
    # Nginx reads the full request body before forwarding to uvicorn,
    # so slow clients don't occupy uvicorn workers.
    # proxy_request_buffering on;       # on by default, explicit for clarity
    # proxy_buffering         on;       # buffer responses from uvicorn too
    # proxy_buffer_size       8k;
    # proxy_buffers           16 8k;

    # --- Security headers (uncomment to enable) ---
    # add_header X-Content-Type-Options  "nosniff"               always;
    # add_header X-Frame-Options         "DENY"                  always;
    # add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # --- Rate limiting (uncomment to enable) ---
        # Allow burst of 20 without delay, reject beyond that
        # limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
