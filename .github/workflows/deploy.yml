name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: cr.selcloud.ru
  IMAGE_NAME: volleyme-prod/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Selectel CR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SELECTEL_CR_USER }}
          password: ${{ secrets.SELECTEL_CR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .ci/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG=${{ github.sha }}

            docker compose pull
            docker compose --profile migrate run --rm volleyme-migrate
            docker compose up -d --remove-orphans

            # echo "Waiting for healthcheck..."
            # timeout 60 bash -c '
            #   until [ "$(docker inspect --format="{{.State.Health.Status}}" volleyme-backend-volleyme-backend-1 2>/dev/null)" = "healthy" ]; do
            #     sleep 2
            #   done
            # ' || { echo "Deploy health check failed!"; docker compose logs volleyme-backend --tail 50; exit 1; }
            # echo "Deploy successful!"

            docker image prune -f
