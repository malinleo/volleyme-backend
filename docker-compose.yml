name: volleyme-backend

services:
  volleyme-backend:
    image: volleyme-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.jwt:/src/.jwt

  volleyme-migrate:
    image: volleyme-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    entrypoint: ["alembic", "upgrade", "head"]

  volleyme-prepare:
    image: volleyme-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./.jwt:/src/.jwt
    entrypoint: ["bash", "bash/create_jwt_key_pair.sh"]
  
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    volumes:
      - volleyme-backend-postgres-data:/var/lib/postgresql/${PROJECT_NAME}/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  volleyme-backend-postgres-data:
    name: volleyme-backend-postgres-data