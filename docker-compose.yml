name: volleyme-backend

services:
  volleyme-backend:
    image: volleyme-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env

  volleyme-migrate:
    image: volleyme-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    entrypoint: ["alembic", "upgrade", "head"]
  
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -h postgres -t 5 -U ${DB_USER} || false"
      ]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - volleyme-backend-postgres-data:/var/lib/postgresql/${PROJECT_NAME}/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  volleyme-backend-postgres-data:
    name: volleyme-backend-postgres-data